name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # Unit tests that only need torch and rsl-rl; Isaac Sim / Isaac Lab are not installed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: source/isaac_asimov/setup.py

      - name: Install CPU dependencies
        # Versions match INSTALL.md and setup.py; CPU wheels keep the job small.
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.7.0 torchvision==0.22.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "rsl-rl-lib==5.0.1" "numpy<2" pytest

      - name: Run tests
        run: python -m pytest -v
